# ЭЛЕРОЗ Коннект: быстрая проверка кода Flutter без полной сборки.
# Файлы моста берутся из готового запуска сборки, поэтому прогон занимает минуты.
name: "ЭЛЕРОЗ Коннект — проверка кода Flutter"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Номер запуска сборки, откуда взять сгенерированные файлы моста"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  analyze:
    name: Анализ
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze changed pages
        working-directory: ./flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos \
            lib/common.dart \
            lib/desktop/pages/eleroz_access.dart \
            lib/desktop/pages/eleroz_help.dart \
            lib/desktop/pages/desktop_home_page.dart \
            lib/desktop/pages/desktop_setting_page.dart \
            lib/desktop/pages/connection_page.dart \
            lib/desktop/widgets/update_progress.dart
